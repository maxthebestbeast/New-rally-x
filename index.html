<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rally-X Game</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; background-color: #f0f0f0; }
    #gameCanvas { background: #aaa; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    // Set up the canvas and game variables
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 600;

    const tileSize = 40;
    const playerSpeed = 4;
    const cpuSpeed = 2;
    let player, cpus = [], flags = [], score = 0;
    let fuel = 100;

    // Player Car Setup
    class Player {
      constructor() {
        this.x = 100;
        this.y = 100;
        this.width = 30;
        this.height = 30;
        this.color = 'blue';
        this.direction = { x: 0, y: 0 };
      }

      move() {
        this.x += this.direction.x;
        this.y += this.direction.y;

        // Boundary checking
        if (this.x < 0) this.x = 0;
        if (this.y < 0) this.y = 0;
        if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;
        if (this.y > canvas.height - this.height) this.y = canvas.height - this.height;

        // Decrease fuel
        fuel -= 0.05;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }
    }

    // CPU Car Setup (AI Cars)
    class CPU {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 30;
        this.height = 30;
        this.color = 'red';
      }

      move(player) {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0) {
          this.x += (dx / dist) * cpuSpeed;
          this.y += (dy / dist) * cpuSpeed;
        }
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }
    }

    // Flag Setup
    class Flag {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 20;
        this.height = 20;
        this.color = 'yellow';
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }
    }

    // Initialize the game
    function init() {
      player = new Player();
      cpus = [
        new CPU(200, 200),
        new CPU(400, 300),
        new CPU(600, 400)
      ];
      flags = [
        new Flag(300, 150),
        new Flag(500, 450),
        new Flag(650, 100)
      ];
      score = 0;
      fuel = 100;
      gameLoop();
    }

    // Game Loop
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Move and draw the player and CPUs
      player.move();
      player.draw();
      cpus.forEach(cpu => {
        cpu.move(player);
        cpu.draw();
      });

      // Draw flags and check for collection
      flags.forEach((flag, index) => {
        flag.draw();
        if (isColliding(player, flag)) {
          flags.splice(index, 1);
          score += 10;
        }
      });

      // Check for collision with CPUs (Game Over condition)
      cpus.forEach(cpu => {
        if (isColliding(player, cpu)) {
          alert('Game Over! Final Score: ' + score);
          init(); // Restart the game
        }
      });

      // Draw score and fuel
      ctx.fillStyle = 'black';
      ctx.font = '20px Arial';
      ctx.fillText('Score: ' + score, 10, 30);
      ctx.fillText('Fuel: ' + Math.round(fuel), 10, 50);

      if (fuel <= 0) {
        alert('Game Over! Out of Fuel');
        init();
      }

      // Radar (mini-map)
      drawRadar();

      requestAnimationFrame(gameLoop);
    }

    // Collision detection
    function isColliding(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
             rect1.x + rect1.width > rect2.x &&
             rect1.y < rect2.y + rect2.height &&
             rect1.y + rect1.height > rect2.y;
    }

    // Draw radar (Mini-map)
    function drawRadar() {
      ctx.strokeStyle = 'black';
      ctx.lineWidth = 2;
      ctx.strokeRect(canvas.width - 150, 10, 140, 140);
      ctx.fillStyle = 'green';
      ctx.fillRect(canvas.width - 150 + player.x / 10, 10 + player.y / 10, 5, 5);

      cpus.forEach(cpu => {
        ctx.fillStyle = 'red';
        ctx.fillRect(canvas.width - 150 + cpu.x / 10, 10 + cpu.y / 10, 5, 5);
      });

      flags.forEach(flag => {
        ctx.fillStyle = 'yellow';
        ctx.fillRect(canvas.width - 150 + flag.x / 10, 10 + flag.y / 10, 5, 5);
      });
    }

    // Player movement controls (Arrow keys)
    document.addEventListener('keydown', function(event) {
      if (event.key === 'ArrowUp') player.direction.y = -playerSpeed;
      if (event.key === 'ArrowDown') player.direction.y = playerSpeed;
      if (event.key === 'ArrowLeft') player.direction.x = -playerSpeed;
      if (event.key === 'ArrowRight') player.direction.x = playerSpeed;
    });

    document.addEventListener('keyup', function(event) {
      if (event.key === 'ArrowUp' || event.key === 'ArrowDown') player.direction.y = 0;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') player.direction.x = 0;
    });

    // Start the game
    init();
  </script>
</body>
</html>
