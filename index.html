<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Rally-X Clone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            background-color: #000;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const tileSize = 40;
        let keys = {};
        let player, enemies = [], flags = [], gameInterval;
        let level = 1, score = 0, lives = 3;

        // Load images
        const playerImg = new Image();
        playerImg.src = 'player.png'; // Replace with your actual image path
        const enemyImg = new Image();
        enemyImg.src = 'enemy.png'; // Replace with your actual image path
        const flagImg = new Image();
        flagImg.src = 'flag.png'; // Replace with your actual image path

        // Car class
        function Car(x, y, image) {
            this.x = x;
            this.y = y;
            this.speed = 2;
            this.image = image;
            this.width = tileSize;
            this.height = tileSize;
            this.direction = { x: 0, y: 0 };
        }

        // Handle keyboard input
        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
        });
        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        // Setup map
        const map = [
            "WWWWWWWWWWWWWWWWWW",
            "W              W W",
            "W WWWWWWWWWWWWWWW W",
            "W W            W W",
            "W W WWWWWWWWWWW W W",
            "W W            W W",
            "W W W WWWWWWW W W W",
            "W W W        W W W",
            "W W W WW WWWWW W W",
            "W W            W W",
            "W W W WWWWWW W W W",
            "W              W W",
            "WWWWWWWWWWWWWWWWWW"
        ];

        // Create a random number of flags on the map
        function placeFlags() {
            flags = [];
            for (let row = 0; row < map.length; row++) {
                for (let col = 0; col < map[row].length; col++) {
                    if (map[row][col] === " ") {
                        if (Math.random() < 0.1) { // 10% chance to place a flag
                            flags.push({ x: col * tileSize, y: row * tileSize });
                        }
                    }
                }
            }
        }

        // Create the player and enemies
        function resetGame() {
            player = new Car(100, 100, playerImg);
            placeFlags();
            enemies = [new Car(200, 200, enemyImg)];
            score = 0;
            level = 1;
        }

        // Move the player
        function moveCar(car) {
            if (keys["w"]) car.direction.y = -1;
            if (keys["s"]) car.direction.y = 1;
            if (keys["a"]) car.direction.x = -1;
            if (keys["d"]) car.direction.x = 1;

            car.x += car.direction.x * car.speed;
            car.y += car.direction.y * car.speed;
            car.direction.x = 0;
            car.direction.y = 0;
        }

        // Draw the map (walls and flags)
        function drawMap() {
            for (let row = 0; row < map.length; row++) {
                for (let col = 0; col < map[row].length; col++) {
                    if (map[row][col] === "W") {
                        ctx.fillStyle = "gray";
                        ctx.fillRect(col * tileSize, row * tileSize, tileSize, tileSize);
                    }
                }
            }

            // Draw flags
            for (let flag of flags) {
                ctx.drawImage(flagImg, flag.x + 12, flag.y + 12, 16, 16);
            }
        }

        // Collision detection for flags
        function checkFlagCollision() {
            for (let i = 0; i < flags.length; i++) {
                const flag = flags[i];
                if (player.x < flag.x + tileSize && player.x + tileSize > flag.x &&
                    player.y < flag.y + tileSize && player.y + tileSize > flag.y) {
                    flags.splice(i, 1);
                    score += 100; // Increase score for flag collection
                    break;
                }
            }
        }

        // Draw the player and enemies
        function drawCars() {
            ctx.drawImage(player.image, player.x, player.y, player.width, player.height);

            for (let enemy of enemies) {
                ctx.drawImage(enemy.image, enemy.x, enemy.y, enemy.width, enemy.height);
            }
        }

        // Improved enemy AI movement (follow player)
        function moveEnemies() {
            for (let enemy of enemies) {
                let dx = player.x - enemy.x;
                let dy = player.y - enemy.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > tileSize) {
                    enemy.x += (dx / dist) * enemy.speed;
                    enemy.y += (dy / dist) * enemy.speed;
                }
            }
        }

        // Check for collisions with walls
        function checkWallCollisions() {
            const playerRect = { x: player.x, y: player.y, width: player.width, height: player.height };
            for (let row = 0; row < map.length; row++) {
                for (let col = 0; col < map[row].length; col++) {
                    if (map[row][col] === "W") {
                        const wallRect = { x: col * tileSize, y: row * tileSize, width: tileSize, height: tileSize };
                        if (isColliding(playerRect, wallRect)) {
                            player.x = playerRect.x;
                            player.y = playerRect.y;
                        }
                    }
                }
            }
        }

        // Collision detection
        function isColliding(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Game loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            moveCar(player);
            moveEnemies();
            drawMap();
            drawCars();
            checkFlagCollision();
            checkWallCollisions();

            // Check if game over
            if (lives <= 0) {
                alert("Game Over! Final Score: " + score);
                resetGame();
            }

            // Level up if all flags are collected
            if (flags.length === 0) {
                level++;
                placeFlags();
                enemies.push(new Car(200 + (level - 1) * 30, 200 + (level - 1) * 30, enemyImg));
            }

            requestAnimationFrame(gameLoop);
        }

        // Start the game
        resetGame();
        gameLoop();
    </script>
</body>
</html>
