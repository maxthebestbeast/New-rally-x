<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rally-X Game</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; background-color: #f0f0f0; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    // Set up canvas and game variables
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 600;

    const tileSize = 40; // Size of each tile
    let player, cpus = [], flags = [], score = 0;

    // Player Car Setup
    class Player {
      constructor() {
        this.x = 100;
        this.y = 100;
        this.width = 30;
        this.height = 30;
        this.color = 'blue';
        this.speed = 5;
        this.direction = { x: 0, y: 0 };
      }

      move() {
        this.x += this.direction.x;
        this.y += this.direction.y;

        // Prevent going off canvas
        if (this.x < 0) this.x = 0;
        if (this.y < 0) this.y = 0;
        if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;
        if (this.y > canvas.height - this.height) this.y = canvas.height - this.height;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }
    }

    // CPU Car Setup
    class CPU {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 30;
        this.height = 30;
        this.color = 'red';
        this.speed = 2;
      }

      move(player) {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0) {
          this.x += (dx / dist) * this.speed;
          this.y += (dy / dist) * this.speed;
        }
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }
    }

    // Flag Setup
    class Flag {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 20;
        this.height = 20;
        this.color = 'yellow';
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }
    }

    // Initialize Game
    function init() {
      player = new Player();
      cpus = [new CPU(200, 200), new CPU(400, 300), new CPU(600, 400)];
      flags = [new Flag(300, 150), new Flag(500, 450)];
      score = 0;
      gameLoop();
    }

    // Game Loop
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Move and draw player and CPUs
      player.move();
      player.draw();
      cpus.forEach(cpu => {
        cpu.move(player);
        cpu.draw();
      });

      // Draw flags and check for collection
      flags.forEach((flag, index) => {
        flag.draw();
        if (isColliding(player, flag)) {
          flags.splice(index, 1);
          score += 10;
          console.log('Score:', score);
        }
      });

      // Game Over check (if player collides with any CPU)
      cpus.forEach(cpu => {
        if (isColliding(player, cpu)) {
          alert('Game Over! Final Score: ' + score);
          init(); // Restart the game
        }
      });

      // Draw score
      ctx.fillStyle = 'black';
      ctx.font = '20px Arial';
      ctx.fillText('Score: ' + score, 10, 30);

      requestAnimationFrame(gameLoop);
    }

    // Collision detection
    function isColliding(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
             rect1.x + rect1.width > rect2.x &&
             rect1.y < rect2.y + rect2.height &&
             rect1.y + rect1.height > rect2.y;
    }

    // Control player movement with keyboard
    document.addEventListener('keydown', function(event) {
      if (event.key === 'ArrowUp') player.direction.y = -player.speed;
      if (event.key === 'ArrowDown') player.direction.y = player.speed;
      if (event.key === 'ArrowLeft') player.direction.x = -player.speed;
      if (event.key === 'ArrowRight') player.direction.x = player.speed;
    });

    document.addEventListener('keyup', function(event) {
      if (event.key === 'ArrowUp' || event.key === 'ArrowDown') player.direction.y = 0;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') player.direction.x = 0;
    });

    // Start the game
    init();
  </script>
</body>
</html>
